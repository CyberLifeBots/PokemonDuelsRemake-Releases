name: Update Patch Manifest

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild the manifest from (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-patch-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"

            # Re-fetch the release so manual asset replacements/uploads
            # performed after publishing are included.
            RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          else
            TAG="${{ inputs.tag }}"
            RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          fi

          VERSION="${TAG#v}"

          echo "Release tag: $TAG"
          echo "Detected version: $VERSION"

          # -----------------------------------------------------
          # FIND NEWEST *_patch.pck ASSET
          #
          # Multiple old patch assets may remain on a release.
          # Always select the most recently uploaded one.
          # -----------------------------------------------------
          ASSET="$(
            jq -c '
              [
                .assets[]
                | select(.name | endswith("_patch.pck"))
              ]
              | sort_by(.created_at)
              | reverse
              | .[0]
            ' <<< "$RELEASE"
          )"

          if [[ "$ASSET" == "null" ]]; then
            echo "::error::No *_patch.pck file was found in release $TAG."
            exit 1
          fi

          NAME="$(jq -r '.name' <<< "$ASSET")"
          URL="$(jq -r '.browser_download_url' <<< "$ASSET")"
          SIZE="$(jq -r '.size' <<< "$ASSET")"
          ASSET_ID="$(jq -r '.id' <<< "$ASSET")"

          echo "Selected patch: $NAME"
          echo "Asset ID: $ASSET_ID"
          echo "Expected size: $SIZE bytes"
          echo "Download URL: $URL"

          # -----------------------------------------------------
          # DOWNLOAD THE EXACT ASSET THROUGH GITHUB API
          #
          # This avoids CDN caching while calculating the SHA.
          # The game itself will still receive the normal,
          # completely plain browser_download_url.
          # -----------------------------------------------------
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            > "/tmp/$NAME"

          ACTUAL_SIZE="$(stat -c%s "/tmp/$NAME")"

          echo "Actual downloaded size: $ACTUAL_SIZE bytes"

          if [[ "$ACTUAL_SIZE" != "$SIZE" ]]; then
            echo "::error::Downloaded asset size does not match GitHub metadata."
            echo "::error::Expected $SIZE bytes but received $ACTUAL_SIZE bytes."
            exit 1
          fi

          SHA="$(sha256sum "/tmp/$NAME" | awk '{print $1}')"

          echo "SHA256: $SHA"

          # IMPORTANT:
          # Use the NORMAL GitHub Release URL.
          # Do not append ?asset_id, ?sha256, timestamps, etc.
          PACKAGE_JSON="$(
            jq -n \
              --arg version "$VERSION" \
              --arg url "$URL" \
              --arg sha "$SHA" \
              --argjson size "$SIZE" \
              '{
                version: $version,
                url: $url,
                sha256: $sha,
                size_bytes: $size
              }'
          )"

          version_ge() {
            [[ "$(
              printf '%s\n%s\n' "$1" "$2" |
              sort -V |
              head -n1
            )" == "$2" ]]
          }

          # -----------------------------------------------------
          # v0.4.0
          # -----------------------------------------------------
          if [[ "$VERSION" == "0.4.0" ]]; then

            echo "Publishing v0.4.0 as permanent legacy bridge."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .base_version = "0.1.0"
              | .current_base_version = "0.4.0"
              | .patch = $package
              | .legacy_bridge = $package
              | .current_patch = {
                  version: "0.4.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # v0.5.0
          #
          # Major bootstrap-base transition.
          # Old pre-0.4 clients still keep the permanent 0.4
          # patch entry, while 0.4 clients receive v0.5 as the
          # next bootstrap bridge.
          # -----------------------------------------------------
          elif [[ "$VERSION" == "0.5.0" ]]; then

            echo "Publishing v0.5.0 as the current bootstrap base."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .base_version = (.base_version // "0.1.0")
              | .current_base_version = "0.5.0"
              | .legacy_bridge = $package
              | .current_patch = {
                  version: "0.5.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # v0.5.0+
          # -----------------------------------------------------
          elif version_ge "$VERSION" "0.5.0"; then

            echo "Publishing v0.5.0+ overlay."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .current_base_version = (
                  .current_base_version // "0.5.0"
                )
              | .current_patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # v0.4.x
          # -----------------------------------------------------
          elif version_ge "$VERSION" "0.4.0"; then

            echo "Publishing v0.4.x overlay."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .current_base_version = (
                  .current_base_version // "0.4.0"
                )
              | .current_patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # PRE-v0.4.0
          # -----------------------------------------------------
          else

            echo "Publishing legacy cumulative patch."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          fi

          mv update_manifest.tmp update_manifest.json

          echo ""
          echo "Generated manifest:"
          cat update_manifest.json

      - name: Commit updated manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          VERSION="$(jq -r '.latest_version' update_manifest.json)"

          git commit -m "Update manifest for v$VERSION"

          for ATTEMPT in 1 2 3; do

            echo "Push attempt $ATTEMPT..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Manifest successfully updated for v$VERSION."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Could not push manifest after 3 attempts."
          exit 1
