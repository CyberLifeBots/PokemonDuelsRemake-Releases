name: Update Patch Manifest

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild the manifest from (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-patch-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
            RELEASE="$(jq -c '.release' "$GITHUB_EVENT_PATH")"
          else
            TAG="${{ inputs.tag }}"
            RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          fi

          VERSION="${TAG#v}"

          echo "Release tag: $TAG"
          echo "Detected version: $VERSION"

          ASSET="$(
            jq -c \
              '[.assets[] | select(.name | endswith("_patch.pck"))][0]' \
              <<< "$RELEASE"
          )"

          if [[ "$ASSET" == "null" ]]; then
            echo "::error::No *_patch.pck file was found in release $TAG."
            exit 1
          fi

          NAME="$(jq -r '.name' <<< "$ASSET")"
          URL="$(jq -r '.browser_download_url' <<< "$ASSET")"
          SIZE="$(jq -r '.size' <<< "$ASSET")"
          ASSET_ID="$(jq -r '.id' <<< "$ASSET")"

          echo "Patch file: $NAME"
          echo "GitHub asset ID: $ASSET_ID"
          echo "Manifest asset size: $SIZE bytes"

          VERIFY_URL="${URL}?asset_id=${ASSET_ID}"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -H "Cache-Control: no-cache" \
            "$VERIFY_URL" \
            -o "/tmp/$NAME"

          ACTUAL_SIZE="$(stat -c%s "/tmp/$NAME")"

          if [[ "$ACTUAL_SIZE" != "$SIZE" ]]; then
            echo "::error::Downloaded patch size does not match the GitHub release asset."
            echo "::error::Expected $SIZE bytes but received $ACTUAL_SIZE bytes."
            exit 1
          fi

          SHA="$(sha256sum "/tmp/$NAME" | awk '{print $1}')"
          DOWNLOAD_URL="${URL}?asset_id=${ASSET_ID}&sha256=${SHA}"

          echo "SHA256: $SHA"
          echo "Client download URL: $DOWNLOAD_URL"

          PACKAGE_JSON="$(
            jq -n \
              --arg version "$VERSION" \
              --arg url "$DOWNLOAD_URL" \
              --arg sha "$SHA" \
              --argjson size "$SIZE" \
              '{
                version: $version,
                url: $url,
                sha256: $sha,
                size_bytes: $size
              }'
          )"

          version_ge() {
            [[ "$(
              printf '%s\n%s\n' "$1" "$2" |
              sort -V |
              head -n1
            )" == "$2" ]]
          }

          if [[ "$VERSION" == "0.4.0" ]]; then
            echo "Publishing v0.4.0 as the permanent legacy bridge and clean base."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .base_version = "0.1.0"
              | .current_base_version = "0.4.0"
              | .patch = $package
              | .legacy_bridge = $package
              | .current_patch = {
                  version: "0.4.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json \
              > update_manifest.tmp

          elif [[ "$VERSION" == "0.5.0" ]]; then
            echo "Promoting v0.5.0 through the first-stage bootstrap."
            echo "The old patch field remains pinned to v0.4.0 for pre-v0.4 updaters."

            # IMPORTANT:
            # v0.5.0 changes startup/UI infrastructure. A normal current_patch is
            # mounted by UpdateManager, which is too late for an older executable's
            # already-cached startup scene. Treat v0.5.0 as the next bootstrap base
            # instead. v0.4.0 clients therefore install this PCK through
            # active_patch_path, letting UpdateBootstrap mount it BEFORE the newer
            # UpdateManager and other autoloads are instantiated.
            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .base_version = (.base_version // "0.1.0")
              | .current_base_version = "0.5.0"
              | .legacy_bridge = $package
              | .current_patch = {
                  version: "0.5.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json \
              > update_manifest.tmp

          elif version_ge "$VERSION" "0.5.0"; then
            echo "Publishing a v0.5.0+ overlay while keeping the v0.5.0 bootstrap base pinned."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .current_base_version = (.current_base_version // "0.5.0")
              | .current_patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          elif version_ge "$VERSION" "0.4.0"; then
            echo "Publishing a v0.4.x overlay while keeping the v0.4.0 bridge pinned."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .current_base_version = (.current_base_version // "0.4.0")
              | .current_patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          else
            echo "Publishing a pre-v0.4.0 legacy cumulative patch."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp
          fi

          mv update_manifest.tmp update_manifest.json

          echo "Generated update_manifest.json:"
          cat update_manifest.json

      - name: Commit updated manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          VERSION="$(jq -r '.latest_version' update_manifest.json)"
          git commit -m "Update manifest for v$VERSION"

          for ATTEMPT in 1 2 3; do
            echo "Push attempt $ATTEMPT of 3..."
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Manifest successfully updated for v$VERSION."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Could not push update_manifest.json after 3 attempts."
          exit 1
