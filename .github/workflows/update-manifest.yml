name: Update Patch Manifest

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild the manifest from (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-patch-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          else
            TAG="${{ inputs.tag }}"
          fi

          RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          VERSION="${TAG#v}"

          echo "Release tag: $TAG"
          echo "Detected version: $VERSION"

          newest_asset_matching() {
            local jq_filter="$1"
            jq -c "[.assets[] | select(${jq_filter})] | sort_by(.created_at) | reverse | .[0]" <<< "$RELEASE"
          }

          package_from_asset() {
            local asset_json="$1"
            local package_version="$2"

            if [[ "$asset_json" == "null" || -z "$asset_json" ]]; then
              echo "::error::Required release asset was not found." >&2
              exit 1
            fi

            local name url size asset_id tmp actual_size sha
            name="$(jq -r '.name' <<< "$asset_json")"
            url="$(jq -r '.browser_download_url' <<< "$asset_json")"
            size="$(jq -r '.size' <<< "$asset_json")"
            asset_id="$(jq -r '.id' <<< "$asset_json")"
            tmp="/tmp/${asset_id}_${name}"

            echo "Preparing $name ($size bytes)" >&2

            # Hash the exact GitHub asset through the API. The manifest still gets
            # the normal browser_download_url, with no query-string cache hacks.
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$tmp"

            actual_size="$(stat -c%s "$tmp")"
            if [[ "$actual_size" != "$size" ]]; then
              echo "::error::$name size mismatch: expected $size, got $actual_size" >&2
              exit 1
            fi

            sha="$(sha256sum "$tmp" | awk '{print $1}')"
            echo "$name SHA256: $sha" >&2

            jq -n \
              --arg version "$package_version" \
              --arg url "$url" \
              --arg sha "$sha" \
              --argjson size "$size" \
              '{
                version: $version,
                url: $url,
                sha256: $sha,
                size_bytes: $size
              }'
          }

          version_ge() {
            [[ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" == "$2" ]]
          }

          # -----------------------------------------------------
          # v0.4.0
          # Permanent bridge for pre-v0.4 updater builds.
          # -----------------------------------------------------
          if [[ "$VERSION" == "0.4.0" ]]; then
            PATCH_ASSET="$(newest_asset_matching '.name | endswith("_patch.pck")')"
            PATCH_PACKAGE="$(package_from_asset "$PATCH_ASSET" "$VERSION")"

            jq \
              --arg version "$VERSION" \
              --argjson package "$PATCH_PACKAGE" \
              '
              .latest_version = $version
              | .base_version = "0.1.0"
              | .current_base_version = "0.4.0"
              | .patch = $package
              | .legacy_bridge = $package
              | .full = {
                  version: "0.1.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              | .current_patch = {
                  version: "0.4.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json > update_manifest.tmp

          # -----------------------------------------------------
          # v0.5.0
          # FULL BASE TRANSITION.
          #
          # Required assets on the v0.5.0 release:
          #   *_bridge_patch.pck   -> tiny updater-only patch made from v0.4.0
          #   *_windows_full.zip   -> complete v0.5.0 Windows build ZIP
          #
          # The internal bridge version is 0.4.1. It is not a public gameplay
          # release; it exists only so already-shipped v0.4.0 clients learn how
          # to download/install the full v0.5.0 build.
          # -----------------------------------------------------
          elif [[ "$VERSION" == "0.5.0" ]]; then
            BRIDGE_ASSET="$(newest_asset_matching '.name | endswith("_bridge_patch.pck")')"
            FULL_ASSET="$(newest_asset_matching '.name | endswith("_windows_full.zip")')"

            if [[ "$BRIDGE_ASSET" == "null" ]]; then
              echo "::error::v0.5.0 requires a *_bridge_patch.pck asset." >&2
              exit 1
            fi
            if [[ "$FULL_ASSET" == "null" ]]; then
              echo "::error::v0.5.0 requires a *_windows_full.zip asset." >&2
              exit 1
            fi

            BRIDGE_PACKAGE="$(package_from_asset "$BRIDGE_ASSET" "0.4.1")"
            FULL_PACKAGE="$(package_from_asset "$FULL_ASSET" "0.5.0")"

            jq \
              --arg version "$VERSION" \
              --argjson bridge "$BRIDGE_PACKAGE" \
              --argjson full "$FULL_PACKAGE" \
              '
              .latest_version = $version
              | .base_version = (.base_version // "0.1.0")
              | .current_base_version = "0.5.0"
              | .legacy_bridge = $bridge
              | .full = $full
              | .current_patch = {
                  version: "0.5.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json > update_manifest.tmp

          # -----------------------------------------------------
          # v0.5.1+
          # Normal cumulative PCK overlays based on the clean v0.5.0 base.
          # Keep the v0.4 updater bridge and v0.5 full ZIP pinned.
          # -----------------------------------------------------
          elif version_ge "$VERSION" "0.5.0"; then
            PATCH_ASSET="$(newest_asset_matching '(.name | endswith("_patch.pck")) and ((.name | endswith("_bridge_patch.pck")) | not)')"

            if [[ "$PATCH_ASSET" == "null" ]]; then
              echo "::error::No normal *_patch.pck file was found in release $TAG." >&2
              exit 1
            fi

            PATCH_PACKAGE="$(package_from_asset "$PATCH_ASSET" "$VERSION")"

            jq \
              --arg version "$VERSION" \
              --argjson package "$PATCH_PACKAGE" \
              '
              .latest_version = $version
              | .current_base_version = "0.5.0"
              | .current_patch = $package
              ' \
              update_manifest.json > update_manifest.tmp

          # -----------------------------------------------------
          # v0.4.x (before the v0.5 transition)
          # -----------------------------------------------------
          elif version_ge "$VERSION" "0.4.0"; then
            PATCH_ASSET="$(newest_asset_matching '.name | endswith("_patch.pck")')"
            PATCH_PACKAGE="$(package_from_asset "$PATCH_ASSET" "$VERSION")"

            jq \
              --arg version "$VERSION" \
              --argjson package "$PATCH_PACKAGE" \
              '
              .latest_version = $version
              | .current_base_version = "0.4.0"
              | .current_patch = $package
              ' \
              update_manifest.json > update_manifest.tmp

          # -----------------------------------------------------
          # pre-v0.4.0 legacy cumulative system
          # -----------------------------------------------------
          else
            PATCH_ASSET="$(newest_asset_matching '.name | endswith("_patch.pck")')"
            PATCH_PACKAGE="$(package_from_asset "$PATCH_ASSET" "$VERSION")"

            jq \
              --arg version "$VERSION" \
              --argjson package "$PATCH_PACKAGE" \
              '
              .latest_version = $version
              | .patch = $package
              ' \
              update_manifest.json > update_manifest.tmp
          fi

          mv update_manifest.tmp update_manifest.json

          echo ""
          echo "Generated update_manifest.json:"
          cat update_manifest.json

      - name: Commit updated manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          VERSION="$(jq -r '.latest_version' update_manifest.json)"
          git commit -m "Update manifest for v$VERSION"

          for ATTEMPT in 1 2 3; do
            echo "Push attempt $ATTEMPT of 3..."
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Manifest successfully updated for v$VERSION."
              exit 0
            fi

            sleep 3
          done

          echo "::error::Could not push update_manifest.json after 3 attempts."
          exit 1
