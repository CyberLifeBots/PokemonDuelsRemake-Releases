name: Update Patch Manifest

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/Update")"

          ASSET="$(jq -c \
            '[.assets[] | select(.name | test("^PokemonDuelsRemake_[0-9]+\\.[0-9]+\\.[0-9]+_patch\\.pck$"))] | sort_by(.created_at) | last' \
            <<< "$RELEASE")"

          if [[ "$ASSET" == "null" ]]; then
            echo "::error::No PokemonDuelsRemake_X.X.X_patch.pck file was found in the Update release."
            exit 1
          fi

          NAME="$(jq -r '.name' <<< "$ASSET")"
          URL="$(jq -r '.browser_download_url' <<< "$ASSET")"
          SIZE="$(jq -r '.size' <<< "$ASSET")"

          VERSION="$(echo "$NAME" | sed -E 's/^PokemonDuelsRemake_([0-9]+\.[0-9]+\.[0-9]+)_patch\.pck$/\1/')"

          echo "Detected version: $VERSION"
          echo "Patch file: $NAME"

          curl -L --fail --retry 3 "$URL" -o "/tmp/$NAME"

          SHA="$(sha256sum "/tmp/$NAME" | awk '{print $1}')"

          jq \
            --arg version "$VERSION" \
            --arg url "$URL" \
            --arg sha "$SHA" \
            --argjson size "$SIZE" \
            '
            .latest_version = $version
            | .patch.version = $version
            | .patch.url = $url
            | .patch.sha256 = $sha
            | .patch.size_bytes = $size
            ' \
            update_manifest.json \
            > update_manifest.tmp

          mv update_manifest.tmp update_manifest.json

      - name: Commit updated manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          VERSION="$(jq -r '.latest_version' update_manifest.json)"

          git commit -m "Update manifest for v$VERSION"
          git push origin HEAD:main
