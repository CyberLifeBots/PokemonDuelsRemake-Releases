name: Update Patch Manifest

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild the manifest from (example: v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

# Prevent two manifest workflows from trying to update main at the same time.
concurrency:
  group: update-patch-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # =========================================================
      # GENERATE MANIFEST
      # =========================================================
      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # -----------------------------------------------------
          # GET RELEASE
          # -----------------------------------------------------
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
            RELEASE="$(jq -c '.release' "$GITHUB_EVENT_PATH")"
          else
            TAG="${{ inputs.tag }}"
            RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          fi

          VERSION="${TAG#v}"

          echo "=========================================="
          echo "Release tag: $TAG"
          echo "Detected version: $VERSION"
          echo "=========================================="

          # -----------------------------------------------------
          # FIND PATCH ASSET
          # -----------------------------------------------------
          ASSET="$(
            jq -c \
              '[.assets[] | select(.name | endswith("_patch.pck"))][0]' \
              <<< "$RELEASE"
          )"

          if [[ "$ASSET" == "null" ]]; then
            echo "::error::No *_patch.pck file was found in release $TAG."
            exit 1
          fi

          NAME="$(jq -r '.name' <<< "$ASSET")"
          URL="$(jq -r '.browser_download_url' <<< "$ASSET")"
          SIZE="$(jq -r '.size' <<< "$ASSET")"
          ASSET_ID="$(jq -r '.id' <<< "$ASSET")"

          echo "Patch file: $NAME"
          echo "GitHub asset ID: $ASSET_ID"
          echo "Manifest asset size: $SIZE bytes"

          # -----------------------------------------------------
          # CACHE-BUSTED DOWNLOAD URL
          #
          # If an asset is deleted and replaced with the exact
          # same filename, GitHub/CDN may temporarily serve an
          # older cached copy.
          #
          # The GitHub asset ID changes whenever the asset is
          # replaced, making this URL unique.
          # -----------------------------------------------------
          VERIFY_URL="${URL}?asset_id=${ASSET_ID}"

          echo "Verification URL:"
          echo "$VERIFY_URL"

          # -----------------------------------------------------
          # DOWNLOAD PATCH
          # -----------------------------------------------------
          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -H "Cache-Control: no-cache" \
            "$VERIFY_URL" \
            -o "/tmp/$NAME"

          # -----------------------------------------------------
          # VERIFY ACTUAL FILE SIZE
          #
          # Do NOT generate a manifest if GitHub gave the workflow
          # a stale/cached asset.
          # -----------------------------------------------------
          ACTUAL_SIZE="$(stat -c%s "/tmp/$NAME")"

          echo "Downloaded size: $ACTUAL_SIZE bytes"
          echo "Expected size:   $SIZE bytes"

          if [[ "$ACTUAL_SIZE" != "$SIZE" ]]; then
            echo "::error::Downloaded patch size does not match the GitHub release asset."
            echo "::error::Expected $SIZE bytes but received $ACTUAL_SIZE bytes."
            echo "::error::GitHub/CDN may still be serving an older cached asset."
            exit 1
          fi

          echo "Patch size verified successfully."

          # -----------------------------------------------------
          # CALCULATE SHA256
          # -----------------------------------------------------
          SHA="$(sha256sum "/tmp/$NAME" | awk '{print $1}')"

          echo "SHA256: $SHA"

          # -----------------------------------------------------
          # FINAL CLIENT DOWNLOAD URL
          #
          # Include both the asset ID and SHA.
          #
          # This ensures clients receive a unique URL whenever a
          # release asset is replaced, even when the filename and
          # release version remain the same.
          # -----------------------------------------------------
          DOWNLOAD_URL="${URL}?asset_id=${ASSET_ID}&sha256=${SHA}"

          echo "Client download URL:"
          echo "$DOWNLOAD_URL"

          # -----------------------------------------------------
          # BUILD PACKAGE JSON
          # -----------------------------------------------------
          PACKAGE_JSON="$(
            jq -n \
              --arg version "$VERSION" \
              --arg url "$DOWNLOAD_URL" \
              --arg sha "$SHA" \
              --argjson size "$SIZE" \
              '{
                version: $version,
                url: $url,
                sha256: $sha,
                size_bytes: $size
              }'
          )"

          # -----------------------------------------------------
          # VERSION COMPARISON
          # -----------------------------------------------------
          version_ge() {
            [[ "$(
              printf '%s\n%s\n' "$1" "$2" |
              sort -V |
              head -n1
            )" == "$2" ]]
          }

          # -----------------------------------------------------
          # v0.4.0
          #
          # Permanent legacy bridge and clean base.
          # -----------------------------------------------------
          if [[ "$VERSION" == "0.4.0" ]]; then

            echo "Publishing v0.4.0 as the permanent legacy bridge and new clean base."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .base_version = "0.1.0"
              | .current_base_version = "0.4.0"
              | .patch = $package
              | .legacy_bridge = $package
              | .current_patch = {
                  version: "0.4.0",
                  url: "",
                  sha256: "",
                  size_bytes: 0
                }
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # v0.4.0+
          #
          # Cumulative overlay for the current base.
          #
          # The original v0.4.0 legacy bridge stays permanently
          # available for older installations.
          # -----------------------------------------------------
          elif version_ge "$VERSION" "0.4.0"; then

            echo "Publishing a v0.4.0+ overlay while keeping the v0.4.0 bridge pinned."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .current_base_version = (
                  .current_base_version // "0.4.0"
                )
              | .current_patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          # -----------------------------------------------------
          # PRE-v0.4.0
          #
          # Original legacy cumulative patch system.
          # -----------------------------------------------------
          else

            echo "Publishing a pre-v0.4.0 legacy cumulative patch."

            jq \
              --arg version "$VERSION" \
              --argjson package "$PACKAGE_JSON" \
              '
              .latest_version = $version
              | .patch = $package
              ' \
              update_manifest.json \
              > update_manifest.tmp

          fi

          mv update_manifest.tmp update_manifest.json

          echo ""
          echo "=========================================="
          echo "Generated update_manifest.json"
          echo "=========================================="
          cat update_manifest.json
          echo ""
          echo "=========================================="

      # =========================================================
      # COMMIT + PUSH
      # =========================================================
      - name: Commit updated manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
            exit 0
          fi

          VERSION="$(jq -r '.latest_version' update_manifest.json)"

          git commit -m "Update manifest for v$VERSION"

          # -----------------------------------------------------
          # SAFE PUSH WITH RETRIES
          #
          # main may have changed while the workflow was
          # downloading and hashing the PCK.
          #
          # Fetch and rebase before pushing instead of force
          # pushing over newer commits.
          # -----------------------------------------------------
          for ATTEMPT in 1 2 3; do

            echo ""
            echo "Push attempt $ATTEMPT of 3..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo ""
              echo "=========================================="
              echo "Manifest successfully updated for v$VERSION."
              echo "=========================================="
              exit 0
            fi

            echo "main changed before the push completed."
            echo "Fetching latest main and trying again..."

            sleep 3

          done

          echo "::error::Could not push update_manifest.json after 3 attempts."
          exit 1
