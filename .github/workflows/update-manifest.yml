name: Update Patch Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (v1.0.4 compatibility, then v1.0.5, v1.0.6...)"
        required: true
        type: string
      dry_run:
        description: "Verify and preview without committing the public manifest"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-patch-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current publisher
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test manifest rules
        run: python3 -m unittest discover -s tests -v

      - name: Download published patch
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a published numeric release tag, for example v1.0.4."
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "$RUNNER_TEMP/patch-manifest.XXXXXX")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_DIR/release.json"
          NAME="$(python3 tools/update_release_manifest.py select \
            --repository "$GITHUB_REPOSITORY" --release "$RELEASE_DIR/release.json")"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$NAME" --dir "$RELEASE_DIR"
          printf 'release_dir=%s\npatch_name=%s\n' "$RELEASE_DIR" "$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify, generate and safely publish manifest
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.download.outputs.release_dir }}
          PATCH_NAME: ${{ steps.download.outputs.patch_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate from current main on a push conflict; never rebase a stale manifest.
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -B manifest-publish FETCH_HEAD
            python3 -m unittest discover -s tests -v
            python3 tools/update_release_manifest.py generate \
              --repository "$GITHUB_REPOSITORY" \
              --release "$RELEASE_DIR/release.json" --pck "$RELEASE_DIR/$PATCH_NAME" \
              --manifest update_manifest.json --output update_manifest.next.json
            mv update_manifest.next.json update_manifest.json
            if git diff --quiet -- update_manifest.json; then
              echo "Manifest already contains this exact patch; nothing to publish."
              exit 0
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              git diff -- update_manifest.json
              echo "Dry run passed. Public manifest was not changed."
              exit 0
            fi
            git add update_manifest.json
            VERSION="$(python3 -c 'import json; print(json.load(open("update_manifest.json"))["latest_version"])')"
            git commit -m "Update manifest for v$VERSION"
            if git push origin HEAD:main; then
              echo "Published v$VERSION; the 1.0.4 compatibility bridge remains pinned."
              exit 0
            fi
            echo "main changed during publishing; regenerating from its latest state ($ATTEMPT/3)."
          done
          echo "::error::Could not publish after three attempts. No force push was used."
          exit 1
